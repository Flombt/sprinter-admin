name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Garde, lint, typage, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Garde anti-secrets (sources)
        run: npm run guard:secrets
      - name: Lint
        run: npm run lint
      - name: Typage
        run: npm run typecheck
      - name: Tests unitaires (Vitest)
        run: npm test
      - name: Build de production
        run: npm run build
        env:
          # Valeurs factices de build : aucune donnée réelle, aucun secret.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: Garde anti-secrets (bundle)
        run: npm run guard:bundle
      - name: JavaScript initial par route (200 Ko gzip)
        run: npm run check:budget
      - name: Lighthouse et interactions sur le build de production synthétique
        run: npm run test:performance
      - name: Rapports de performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: .lighthouseci/reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Gitleaks sur tout l'historique
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git . --redact --no-banner

  e2e:
    name: Parcours Playwright + axe (faux backend synthétique)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Le projet Playwright utilise le canal « chrome » (Google Chrome stable, présent sur ubuntu-latest).
      - name: Vérifier Google Chrome
        run: google-chrome --version
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
